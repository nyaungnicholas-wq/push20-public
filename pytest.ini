[pytest]
# Only collect the real unit tests in tests/. Without this, pytest also picks up
# the research scripts in reports/ named *_test.py (news_proxy_test.py,
# political_news_test.py, futures_signal_test.py, etc.), which run full backtests
# on import — slow, and they rewrite their result JSONs as a side effect.
testpaths = tests
python_files = test_*.py
